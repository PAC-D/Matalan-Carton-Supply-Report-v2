# Include this snippet in the HTTPS server block for the target domain.
location = /matalan-carton-report {
    return 301 /matalan-carton-report/$is_args$args;
}

location /matalan-carton-report/ {
    # Create this file before enabling the site, for example with htpasswd.
    # Keeping auth active makes a missing password file fail closed.
    auth_basic "Matalan Carton Supply Report";
    auth_basic_user_file /etc/nginx/.htpasswd-matalan-carton-report;

    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_set_header Authorization "";
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
