services:
  matalan-carton-report:
    build: .
    image: matalan-carton-report
    container_name: matalan-carton-report
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    volumes:
      - ./Reports:/app/Reports
      - ./certs:/app/certs:ro
    mem_limit: 1g
